# OpenCart admin URLs carry the user_token in the query string and in the referer.
# Log the access path without the query string and without the referer, and log errors
# without the referer, so no token reaches the container log.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" combined
# The error format is the Apache default without its last field, the referer.
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %T] %7F: %E: [client\ %a] %M"
